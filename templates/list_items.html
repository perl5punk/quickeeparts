<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junk Items — QuickeeParts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 { color: #333; }
        nav a { margin-right: 15px; }
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .item-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fff;
        }
        .item-card img {
            width: 100%;
            max-width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .item-card h3 { margin: 0 0 5px 0; }
        .item-card p { color: #666; }
        .item-card a { color: #0066cc; text-decoration: none; }
        .item-card a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Your Junk Items</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/items/new">Add New Item</a>
    </nav>
    <div class="item-grid">
    {% for item in items %}
        <div class="item-card">
            {% if item.photo_filename %}
                <img src="/static/uploads/thumbnails/{{ item.photo_filename.rsplit('.', 1)[0] }}_thumb.jpg" alt="{{ item.name }}">
            {% else %}
                <img src="/static/images/placeholder.png" alt="No photo">
            {% endif %}
            <h3><a href="/items/{{ item.id }}">{{ item.name }}</a></h3>
            <p>{{ item.description or 'No description' }}</p>
            <p><small>Category: {{ item.category or 'N/A' }}</small></p>
            <p><small>Status: {{ item.status }}</small></p>
        </div>
    {% endfor %}
    </div>
</body>
</html>
