<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Junk Item — QuickeeParts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 { color: #333; }
        nav a { margin-right: 15px; }
        form { margin-top: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }
        textarea { height: 80px; }
        button { margin-top: 15px; padding: 8px 20px; cursor: pointer; }
        .hint { color: #666; font-size: 0.9em; margin-top: 4px; }
        .error { color: red; font-size: 0.9em; margin-top: 4px; }
        #photo-preview { margin-top: 10px; }
        #photo-preview img { max-width: 200px; max-height: 200px; }
    </style>
</head>
<body>
    <h1>Add New Junk Item</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/items">View All Junk</a>
    </nav>
    <form method="POST" action="/items/new" enctype="multipart/form-data" id="item-form">
        <label for="name">Name (required)</label>
        <input type="text" id="name" name="name" required>

        <label for="description">Description</label>
        <textarea id="description" name="description"></textarea>

        <label for="category">Category</label>
        <input type="text" id="category" name="category">

        <label for="status">Status</label>
        <input type="text" id="status" name="status" value="pending">

        <label for="condition">Condition</label>
        <input type="text" id="condition" name="condition">

        <label for="photo">Upload Photo</label>
        <input type="file" id="photo" name="photo" accept=".jpg,.jpeg,.png,.gif">
        <p class="hint">Accepted formats: JPG, PNG, GIF. Max 20MB.</p>
        <p class="error" id="file-error" style="display: none;"></p>
        <div id="photo-preview"></div>

        <button type="submit">Add Item</button>
    </form>

    <script>
        var photoInput = document.getElementById('photo');
        var fileError = document.getElementById('file-error');
        var photoPreview = document.getElementById('photo-preview');

        photoInput.addEventListener('change', function() {
            var file = this.files[0];
            fileError.style.display = 'none';
            photoPreview.innerHTML = '';
            if (!file) return;

            // Check file size (20MB limit)
            if (file.size > 20 * 1024 * 1024) {
                fileError.textContent = 'File too large. Maximum size is 20MB.';
                fileError.style.display = 'block';
                this.value = '';
                return;
            }

            // Check file type
            var allowedTypes = ['image/jpeg', 'image/png', 'image/gif'];
            if (allowedTypes.indexOf(file.type) === -1) {
                fileError.textContent = 'Invalid file type. Only JPG, PNG, and GIF files are allowed.';
                fileError.style.display = 'block';
                this.value = '';
                return;
            }

            // Preview the image
            var reader = new FileReader();
            reader.onload = function(e) {
                photoPreview.innerHTML = '<img src="' + e.target.result + '" alt="Preview">';
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
