<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuickeeParts — Add Junk</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        h1 { color: #333; }
        label { display: block; margin-top: 10px; }
        input[type="text"], textarea { width: 300px; padding: 5px; }
        input[type="submit"] { margin-top: 15px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>QuickeeParts — Add Junk</h1>
    <form method="POST" action="/add">
        <label>Name:
            <input type="text" name="name" required>
        </label>
        <label>Description:
            <textarea name="description" rows="4" cols="40"></textarea>
        </label>
        <label>Category:
            <input type="text" name="category">
        </label>
        <input type="submit" value="Add Junk">
    </form>
    <p><a href="/">Home</a> | <a href="/list">View All Junk</a></p>
</body>
</html>
