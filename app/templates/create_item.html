{% extends "base.html" %}
{% block title %}Add Junk Item - QuickeeParts{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Add New Junk Item</h2>
</div>

<div class="form-container">
    <form id="createItemForm" action="/items/new" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Item Name *</label>
            <input type="text" id="name" name="name" required placeholder="Enter item name">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Describe the item"></textarea>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="e.g., Electronics, Hardware, Mechanical">
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="pending" selected>Pending</option>
                <option value="approved">Approved</option>
                <option value="listed">Listed</option>
            </select>
        </div>

        <div class="form-group">
            <label for="condition">Condition</label>
            <input type="text" id="condition" name="condition" placeholder="e.g., New, Used, Damaged">
        </div>

        <div class="form-group">
            <label for="photo">Upload Photo</label>
            <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/gif">
            <p class="form-hint">Accepted formats: JPG, PNG, GIF. Max 20MB.</p>
            <p id="photoError" class="form-error" style="display: none;"></p>
            <p id="photoSuccess" class="form-success" style="display: none;"></p>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Item</button>
            <a href="/items" class="btn">Cancel</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const photoInput = document.getElementById('photo');
    const photoError = document.getElementById('photoError');
    const photoSuccess = document.getElementById('photoSuccess');

    photoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        photoError.style.display = 'none';
        photoSuccess.style.display = 'none';

        if (!file) return;

        // Validate file type
        const validTypes = ['image/jpeg', 'image/png', 'image/gif'];
        if (!validTypes.includes(file.type)) {
            photoError.textContent = 'Invalid file type. Only JPG, PNG, and GIF files are allowed.';
            photoError.style.display = 'block';
            photoSuccess.style.display = 'none';
            e.target.value = '';
            return;
        }

        // Validate file size (20MB max)
        const maxSize = 20 * 1024 * 1024; // 20MB
        if (file.size > maxSize) {
            photoError.textContent = 'File too large. Maximum size is 20MB.';
            photoError.style.display = 'block';
            photoSuccess.style.display = 'none';
            e.target.value = '';
            return;
        }

        // Validation passed
        photoSuccess.textContent = 'Photo uploaded successfully';
        photoSuccess.style.display = 'block';
        photoError.style.display = 'none';
    });

    document.getElementById('createItemForm').addEventListener('submit', function(e) {
        // Client-side validation already done via file input listener
        // If there are errors, prevent submission
        if (photoError.style.display === 'block') {
            e.preventDefault();
        }
    });
});
</script>
{% endblock %}
